<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秋叶集团｜组合播放</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090a0c;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}iframe{width:100%;height:100%;border:0;display:block}.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:8px;background:rgba(12,14,18,.88);backdrop-filter:blur(14px);padding:8px 10px;border:1px solid rgba(255,255,255,.18);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.28);opacity:.96;transition:.2s}.nav:hover{transform:translateX(-50%) translateY(-2px)}.nav button{border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(255,255,255,.12);color:white;padding:8px 12px;cursor:pointer;white-space:nowrap}.nav button:hover{background:rgba(255,255,255,.22)}.nav .play{background:#bd1f27;border-color:#bd1f27;color:white}.nav span{color:white;font-size:12px;min-width:60px;text-align:center;font-variant-numeric:tabular-nums}.panel{position:fixed;right:18px;top:18px;z-index:20;width:min(390px,calc(100vw - 36px));max-height:calc(100vh - 118px);overflow:auto;padding:18px;background:rgba(18,20,24,.96);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.16);border-radius:18px;color:#f5f6f8;box-shadow:0 18px 54px rgba(0,0,0,.4);display:none}.panel.show{display:block}.panel h2{font-size:18px;margin:0}.panel header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.panel header button{border:0;background:transparent;color:#aaa;font-size:22px;cursor:pointer}.panel section{border-top:1px solid rgba(255,255,255,.12);padding-top:14px;margin-top:14px}.panel label{display:block;color:#aeb4bf;font-size:12px;margin-bottom:10px}.panel input,.panel select,.panel textarea{display:block;width:100%;margin-top:6px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:rgba(255,255,255,.08);color:#fff;padding:9px 10px;font:inherit}.panel textarea{min-height:70px;resize:vertical}.panel input[type=file]{padding:7px}.panel select option{background:#20232a;color:#fff}.voice-mode-panel{display:none}.voice-mode-panel.show{display:block}.panel button.action{border:1px solid rgba(255,255,255,.2);border-radius:9px;background:rgba(255,255,255,.12);color:#fff;padding:8px 10px;cursor:pointer;margin:2px 4px 2px 0}.panel button.action.primary{background:#bd1f27;border-color:#bd1f27}.panel button.action.danger{color:#ff9e9e}.panel .hint{font-size:11px;color:#9299a5;line-height:1.6;margin:8px 0 0}.panel .status{font-size:12px;color:#bfc5cf;line-height:1.55;min-height:18px}.plans{display:grid;gap:8px}.plan{display:flex;align-items:center;gap:7px;padding:9px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:rgba(255,255,255,.05)}.plan .plan-main{min-width:0;flex:1}.plan strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.plan small{display:block;color:#9299a5;margin-top:3px;font-size:10px}.plan button{border:0;border-radius:7px;padding:6px 8px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}.plan button.delete{color:#ff9e9e}.badge{display:inline-block;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:3px 7px;color:#cdd2dc;font-size:10px;margin-left:5px}@media(max-width:720px){.nav{left:10px;right:10px;bottom:10px;transform:none;overflow:auto;justify-content:flex-start}.nav:hover{transform:none}.nav button{padding:8px 10px}.nav span{min-width:52px}.panel{top:10px;right:10px;max-height:calc(100vh - 90px)}}
</style></head><body><iframe id="frame" title="组合播放页面"></iframe>
<div class="panel" id="panel" aria-hidden="true"><header><h2>方案与本地音频</h2><button id="closePanel" aria-label="关闭">×</button></header><div class="status" id="currentPlan">当前方案：未保存</div><section><label>方案名称<input id="planName" maxlength="80" placeholder="例如：高校领导汇报版"></label><button class="action primary" id="savePlan">保存当前方案</button><button class="action" id="saveAsPlan">另存为新方案</button><p class="hint">方案会保存当前页面顺序、页面文案版本和音色音频关联。不同顺序的组合会使用不同的本地音频缓存。</p></section><section><div class="status">已保存的本地方案</div><div class="plans" id="plans"><div class="hint">正在读取……</div></div></section><section><label>音色模式<select id="voiceMode"><option value="preset" selected>预置音色</option><option value="design">音色设计（文字描述）</option><option value="clone">音色克隆（上传参考音频）</option></select></label><div class="voice-mode-panel" id="presetVoiceWrap"><label>MiMo 预置音色<select id="voiceSelect"><option value="mimo_default">mimo_default</option><option value="冰糖" selected>冰糖</option><option value="茉莉">茉莉</option><option value="苏打">苏打</option><option value="白桦">白桦</option><option value="Mia">Mia</option><option value="Chloe">Chloe</option><option value="Milo">Milo</option><option value="Dean">Dean</option></select></label></div><div class="voice-mode-panel" id="designVoiceWrap"><label>音色描述<textarea id="voiceDesign" maxlength="1000" placeholder="例如：成熟稳重的中文男声，声音低沉但清晰，语速适中，适合高校商务汇报，语气自然可信。"></textarea></label><p class="hint">这里描述的是“声音本身”，例如年龄、性别、音色、气质、语速和适用场景；不是要朗读的内容。</p></div><div class="voice-mode-panel" id="cloneVoiceWrap"><label>已保存的克隆音色<select id="cloneProfile"><option value="">请选择一个克隆音色</option></select></label><label>参考音频（MP3 或 WAV）<input id="cloneFile" type="file" accept="audio/mpeg,audio/mp3,audio/wav,.mp3,.wav"></label><label>音色名称<input id="cloneName" maxlength="80" placeholder="例如：我的商务男声"></label><button class="action primary" id="saveCloneProfile">保存参考音频</button><button class="action danger" id="deleteCloneProfile">删除当前克隆音色</button><p class="hint">参考音频只保存在当前浏览器的 IndexedDB 中。建议使用几秒钟、单人、无背景音乐且吐字清晰的 MP3/WAV 音频。</p></div><label>语气与表达<textarea id="style" maxlength="500">请用专业、自然、可信赖的企业介绍口吻，普通话，语速适中，停顿清晰，不要过度播音腔。</textarea></label><button class="action primary" id="generateCurrent">生成当前页音频</button><button class="action" id="generateAll">生成本方案全部音频</button><button class="action danger" id="clearCurrentAudio">清理本方案音频缓存</button><p class="hint">生成后的 WAV 会保存在当前浏览器的 IndexedDB 中，不会覆盖 shared/audio 里的原始音频。音色设计和音色克隆会与预置音色分别缓存。</p><div class="status" id="audioStatus"></div></section></div>
<div class="nav"><button onclick="location.href='index.html'">页面库</button><button id="manage">方案与音频</button><button id="fs">全屏</button><button id="prev">←</button><button class="play" id="auto">▶ 自动讲解</button><span id="pos"></span><button id="next">→</button></div>
<script src="shared/local-library.js"></script><script>
const library=window.QiuyeLocalLibrary;let manifest=[],list=[],i=0,auto=false,timer=null,currentPlan=null,objectUrl='',loading=false,voiceProfiles=[];const f=document.getElementById('frame'),pos=document.getElementById('pos'),panel=document.getElementById('panel'),planName=document.getElementById('planName'),voiceMode=document.getElementById('voiceMode'),presetVoiceWrap=document.getElementById('presetVoiceWrap'),designVoiceWrap=document.getElementById('designVoiceWrap'),cloneVoiceWrap=document.getElementById('cloneVoiceWrap'),voiceSelect=document.getElementById('voiceSelect'),voiceDesign=document.getElementById('voiceDesign'),cloneProfile=document.getElementById('cloneProfile'),cloneFile=document.getElementById('cloneFile'),cloneName=document.getElementById('cloneName'),styleInput=document.getElementById('style'),planStatus=document.getElementById('currentPlan'),audioStatus=document.getElementById('audioStatus');
const params=new URLSearchParams(location.search);
async function boot(){try{manifest=await fetch('manifest.json').then(r=>r.json());await library.requestPersistence();await renderVoiceProfiles();const planId=params.get('plan');currentPlan=planId?await library.getPlan(planId):null;list=currentPlan?.pages?.slice()||(params.get('slides')?params.get('slides').split(',').map(Number).filter(Boolean):manifest.map(x=>x.page));if(!list.length)list=manifest.map(x=>x.page);planName.value=currentPlan?.name||'';if(currentPlan?.voiceSettings)setVoiceSettings(currentPlan.voiceSettings);else if(currentPlan?.voice)setVoiceSettings({mode:'preset',voice:currentPlan.voice});if(currentPlan?.style)styleInput.value=currentPlan.style;syncVoiceMode();renderPlanStatus();await renderPlans();show(0)}catch(error){audioStatus.textContent='初始化失败：'+error.message}}
function itemAt(slot=i){return manifest.find(x=>x.page===list[slot])}
function getSignature(){return currentPlan?.signature||library.makePlanSignature(list,manifest)}
function getVoiceSettings(){const mode=voiceMode.value;if(mode==='design')return{mode,model:'mimo-v2.5-tts-voicedesign',voiceDesign:voiceDesign.value.trim(),cacheKey:`design:${library.hashText(voiceDesign.value.trim())}`};if(mode==='clone')return{mode,model:'mimo-v2.5-tts-voiceclone',profileId:cloneProfile.value,cacheKey:`clone:${cloneProfile.value||'none'}`};return{mode:'preset',model:'mimo-v2.5-tts',voice:voiceSelect.value,cacheKey:`preset:${voiceSelect.value}`}}
function getCacheVoiceKey(){const settings=getVoiceSettings();return `${settings.cacheKey}|style:${library.hashText(styleInput.value.trim())}`}
function getVoiceLabel(settings=getVoiceSettings()){if(settings.mode==='design')return'音色设计';if(settings.mode==='clone'){const profile=voiceProfiles.find(item=>item.id===settings.profileId);return profile?`克隆音色：${profile.name}`:'音色克隆'}return settings.voice||'冰糖'}
function syncVoiceMode(){const mode=voiceMode.value;presetVoiceWrap.classList.toggle('show',mode==='preset');designVoiceWrap.classList.toggle('show',mode==='design');cloneVoiceWrap.classList.toggle('show',mode==='clone')}
function setVoiceSettings(settings){const mode=settings?.mode||'preset';voiceMode.value=mode;if(mode==='design')voiceDesign.value=settings.voiceDesign||'';if(mode==='clone')cloneProfile.value=settings.profileId||'';if(mode==='preset')voiceSelect.value=settings.voice||'冰糖';syncVoiceMode()}
function getText(slot=i){return itemAt(slot)?.narration||''}
function renderPlanStatus(){planStatus.innerHTML=currentPlan?`当前方案：<strong>${escapeHtml(currentPlan.name)}</strong><span class="badge">${list.length} 页</span>`:`当前方案：未保存<span class="badge">${list.length} 页</span>`}
async function saveCurrent(asNew=false){if(!list.length)return;const name=planName.value.trim()||`组合方案 ${new Date().toLocaleString('zh-CN',{hour12:false})}`;const signature=library.makePlanSignature(list,manifest);const record=await library.putPlan({id:asNew?null:currentPlan?.id,name,pages:list.slice(),signature,voiceSettings:getVoiceSettings(),style:styleInput.value.trim(),snapshot:list.map(page=>{const x=manifest.find(m=>m.page===page)||{};return{page,title:x.title||'',narration:x.narration||''}})});currentPlan=record;planName.value=record.name;history.replaceState(null,'',`present.html?plan=${encodeURIComponent(record.id)}`);renderPlanStatus();await renderPlans();setStatus(`方案已保存：${record.name}`)}
async function ensurePlan(){if(!currentPlan)await saveCurrent();return currentPlan}
function prepareFrame(){try{f.contentDocument?.getElementById('audioBtn')?.closest('.page-tools')?.remove();f.contentDocument?.getElementById('scriptPanel')?.remove()}catch(error){}}
function releaseObjectUrl(){if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=''}}
async function applyCachedAudio(){const audio=f.contentDocument?.getElementById('narration');if(!audio)return null;const originalSrc=audio.dataset.originalSrc||audio.getAttribute('src')||audio.src;audio.dataset.originalSrc=originalSrc;releaseObjectUrl();audio.src=originalSrc;audio.load();if(!currentPlan)return audio;const record=await library.getAudio({signature:currentPlan.signature,slot:i,page:itemAt()?.page,voice:getCacheVoiceKey(),textHash:library.hashText(getText())});if(record?.blob){objectUrl=URL.createObjectURL(record.blob);audio.src=objectUrl;audio.dataset.localAudio='1';audio.load();setStatus(`当前页已使用本地音频缓存 · ${getVoiceLabel()}`)}else{audio.dataset.localAudio='0';setStatus('当前页使用原始音频；可在“方案与音频”中生成新音频')}return audio}
async function playCurrent(){const audio=await applyCachedAudio();if(audio&&audio.src){audio.play().catch(()=>setStatus('浏览器阻止了自动播放，请点击“自动讲解”或页面中的播放按钮'));audio.onended=()=>next()}else timer=setTimeout(next,8000)}
function show(n){if(n<0||n>=list.length)return;i=n;clearTimeout(timer);releaseObjectUrl();const x=itemAt();if(!x)return;f.onload=async()=>{prepareFrame();const audio=await applyCachedAudio();if(auto){if(audio?.src){audio.play().catch(()=>{});audio.onended=()=>next()}else timer=setTimeout(next,8000)}};f.src=encodeURI(x.path);pos.textContent=`${i+1} / ${list.length}`;renderPlanStatus()}
function next(){if(i<list.length-1)show(i+1);else{auto=false;document.getElementById('auto').textContent='▶ 自动讲解';setStatus('本方案播放完成')}}
function setStatus(message){audioStatus.textContent=message}
async function renderVoiceProfiles(selectedId=''){voiceProfiles=await library.listVoiceProfiles('clone');const previous=selectedId||cloneProfile.value;cloneProfile.innerHTML='<option value="">请选择一个克隆音色</option>'+voiceProfiles.map(profile=>`<option value="${escapeHtml(profile.id)}">${escapeHtml(profile.name)}</option>`).join('');if(previous&&voiceProfiles.some(profile=>profile.id===previous))cloneProfile.value=previous}
function blobToDataUrl(blob,mimeType='audio/wav'){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error||new Error('读取参考音频失败'));reader.readAsDataURL(new Blob([blob],{type:mimeType||blob.type||'audio/wav'}))})}
async function saveCloneProfile(){const file=cloneFile.files?.[0];if(!file){setStatus('请先选择一段 MP3 或 WAV 参考音频');return}const type=file.type||(/\.mp3$/i.test(file.name)?'audio/mpeg':'audio/wav');if(!['audio/mpeg','audio/mp3','audio/wav','audio/x-wav'].includes(type)){setStatus('参考音频只支持 MP3 或 WAV 格式');return}if(file.size>7.5*1024*1024){setStatus('参考音频建议控制在 7.5 MB 以内');return}const profile=await library.putVoiceProfile({type:'clone',name:cloneName.value.trim()||file.name,mimeType:type,blob:file,size:file.size});await renderVoiceProfiles(profile.id);voiceMode.value='clone';syncVoiceMode();setStatus(`克隆音色“${profile.name}”已保存到当前浏览器`)}
async function deleteCloneProfile(){const id=cloneProfile.value;if(!id)return;const profile=voiceProfiles.find(item=>item.id===id);if(!profile||!confirm(`确定删除克隆音色“${profile.name}”吗？已生成的音频缓存不会删除。`))return;await library.deleteVoiceProfile(id);await renderVoiceProfiles();setStatus('克隆音色已删除，已有音频缓存仍保留')}
async function renderPlans(){const plans=await library.listPlans();const box=document.getElementById('plans');if(!plans.length){box.innerHTML='<div class="hint">还没有保存的本地方案。</div>';return}box.innerHTML=plans.map(plan=>`<div class="plan"><div class="plan-main"><strong>${escapeHtml(plan.name)}</strong><small>${plan.pages.length} 页 · ${new Date(plan.updatedAt).toLocaleString('zh-CN',{hour12:false})}</small></div><button data-load="${plan.id}">打开</button><button class="delete" data-delete="${plan.id}">删除</button></div>`).join('');box.querySelectorAll('[data-load]').forEach(button=>button.onclick=()=>loadPlan(button.dataset.load));box.querySelectorAll('[data-delete]').forEach(button=>button.onclick=()=>removePlan(button.dataset.delete))}
async function loadPlan(id){const plan=await library.getPlan(id);if(!plan)return;currentPlan=plan;list=plan.pages.slice();i=0;planName.value=plan.name;if(plan.voiceSettings)setVoiceSettings(plan.voiceSettings);else if(plan.voice)setVoiceSettings({mode:'preset',voice:plan.voice});if(plan.style)styleInput.value=plan.style;history.replaceState(null,'',`present.html?plan=${encodeURIComponent(plan.id)}`);renderPlanStatus();show(0);setStatus(`已打开方案：${plan.name}`)}
async function removePlan(id){const plan=await library.getPlan(id);if(!plan||!confirm(`确定删除本地方案“${plan.name}”吗？已生成的音频缓存不会删除。`))return;await library.deletePlan(id);if(currentPlan?.id===id){currentPlan=null;planName.value='';history.replaceState(null,'',`present.html?slides=${list.join(',')}`);renderPlanStatus()}await renderPlans();setStatus('方案已删除，音频缓存仍保留以便后续复用')}
async function requestAudio(slot){const plan=await ensurePlan();const settings=getVoiceSettings();const x=itemAt(slot);if(!x)return;if(settings.mode==='design'&&!settings.voiceDesign)throw new Error('请先填写音色设计描述');if(settings.mode==='clone'&&!settings.profileId)throw new Error('请先选择或保存一个克隆音色');if(currentPlan){currentPlan=await library.putPlan({...currentPlan,voiceSettings:settings,style:styleInput.value.trim()})}let cloneAudio='';if(settings.mode==='clone'){const profile=await library.getVoiceProfile(settings.profileId);if(!profile?.blob)throw new Error('找不到当前克隆音色的参考音频');cloneAudio=await blobToDataUrl(profile.blob,profile.mimeType)}const text=getText(slot);const textHash=library.hashText(text);const cacheVoice=getCacheVoiceKey();const label=getVoiceLabel(settings);setStatus(`正在生成第 ${slot+1} 页音频 · ${label}……`);const response=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:settings.mode,voice:settings.voice,voiceDesign:settings.voiceDesign,cloneAudio,style:styleInput.value.trim(),text,planSignature:plan.signature})});if(!response.ok){const message=await response.text();throw new Error(message||`TTS 请求失败（${response.status}）`)}const blob=await response.blob();await library.putAudio({signature:plan.signature,slot,page:x.page,voice:cacheVoice,textHash,blob});if(slot===i){await applyCachedAudio();if(auto)playCurrent()}return blob}
async function generateCurrent(){if(loading)return;loading=true;try{await requestAudio(i);setStatus(`第 ${i+1} 页音频已保存到浏览器本地 · ${getVoiceLabel()}`)}catch(error){setStatus('生成失败：'+error.message)}finally{loading=false}}
async function generateAll(){if(loading)return;loading=true;try{await ensurePlan();for(let slot=0;slot<list.length;slot+=1){await requestAudio(slot);setStatus(`正在生成本方案音频：${slot+1}/${list.length}`)}setStatus(`本方案 ${list.length} 页音频已保存到浏览器本地 · ${getVoiceLabel()}`);await applyCachedAudio()}catch(error){setStatus('生成失败：'+error.message)}finally{loading=false}}
document.getElementById('next').onclick=next;document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('auto').onclick=()=>{auto=!auto;document.getElementById('auto').textContent=auto?'❚❚ 停止自动':'▶ 自动讲解';if(auto)show(i);else{try{f.contentDocument?.getElementById('narration')?.pause()}catch(error){}clearTimeout(timer)}};document.getElementById('fs').onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById('manage').onclick=()=>{panel.classList.toggle('show');panel.setAttribute('aria-hidden',String(!panel.classList.contains('show')))};document.getElementById('closePanel').onclick=()=>{panel.classList.remove('show');panel.setAttribute('aria-hidden','true')};document.getElementById('savePlan').onclick=()=>saveCurrent(false);document.getElementById('saveAsPlan').onclick=()=>saveCurrent(true);document.getElementById('generateCurrent').onclick=generateCurrent;document.getElementById('generateAll').onclick=generateAll;document.getElementById('saveCloneProfile').onclick=saveCloneProfile;document.getElementById('deleteCloneProfile').onclick=deleteCloneProfile;document.getElementById('clearCurrentAudio').onclick=async()=>{if(!currentPlan||!confirm('确定清理当前方案的本地音频缓存吗？'))return;await library.clearAudio(currentPlan.signature);await applyCachedAudio();setStatus('当前方案的本地音频缓存已清理，原始音频仍然保留')};voiceMode.onchange=()=>{syncVoiceMode();applyCachedAudio()};voiceSelect.onchange=()=>applyCachedAudio();cloneProfile.onchange=()=>applyCachedAudio();document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')show(i-1);if(e.key==='f'||e.key==='F')document.documentElement.requestFullscreen?.();if(e.key==='Escape')panel.classList.remove('show')});syncVoiceMode();boot();
function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
</script></body></html>
