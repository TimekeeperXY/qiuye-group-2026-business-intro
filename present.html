<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秋叶集团｜组合播放</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090a0c;overflow:hidden;font-family:"Microsoft YaHei",sans-serif}iframe{width:100%;height:100%;border:0;display:block}.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:8px;background:rgba(12,14,18,.86);backdrop-filter:blur(14px);padding:8px 10px;border:1px solid rgba(255,255,255,.18);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.28);opacity:.94;transition:.2s}.nav:hover{transform:translateX(-50%) translateY(-2px)}.nav button{border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(255,255,255,.12);color:white;padding:8px 12px;cursor:pointer}.nav button:hover{background:rgba(255,255,255,.22)}.nav .play{background:#bd1f27;border-color:#bd1f27;color:white}.nav span{color:white;font-size:12px;min-width:60px;text-align:center;font-variant-numeric:tabular-nums}</style></head><body><iframe id="frame"></iframe><div class="nav"><button onclick="location.href='index.html'">页面库</button><button id="fs">全屏</button><button id="prev">←</button><button class="play" id="auto">▶ 自动讲解</button><span id="pos"></span><button id="next">→</button></div><script>
let manifest=[],list=[],i=0,auto=false,timer=null;const f=document.getElementById('frame'),pos=document.getElementById('pos');fetch('manifest.json').then(r=>r.json()).then(m=>{manifest=m;let q=new URLSearchParams(location.search).get('slides');list=q?q.split(',').map(Number).filter(Boolean):m.map(x=>x.page);show(0)});function item(){return manifest.find(x=>x.page===list[i])}function prepareFrame(){try{f.contentDocument?.getElementById('audioBtn')?.closest('.page-tools')?.remove();f.contentDocument?.getElementById('scriptPanel')?.remove()}catch(e){}}function show(n){if(n<0||n>=list.length)return;i=n;let x=item();f.onload=()=>{prepareFrame();if(auto){try{let a=f.contentDocument.getElementById('narration');if(a&&a.src){a.play().catch(()=>{});a.onended=()=>next()}else timer=setTimeout(next,8000)}catch(e){timer=setTimeout(next,8000)}}};f.src=encodeURI(x.path);pos.textContent=`${i+1} / ${list.length}`;clearTimeout(timer)}function next(){if(i<list.length-1)show(i+1);else{auto=false;document.getElementById('auto').textContent='▶ 自动讲解'}}document.getElementById('next').onclick=next;document.getElementById('prev').onclick=()=>show(i-1);document.getElementById('auto').onclick=()=>{auto=!auto;document.getElementById('auto').textContent=auto?'❚❚ 停止自动':'▶ 自动讲解';show(i)};document.getElementById('fs').onclick=()=>document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')show(i-1);if(e.key==='f'||e.key==='F')document.documentElement.requestFullscreen?.()});</script></body></html>
