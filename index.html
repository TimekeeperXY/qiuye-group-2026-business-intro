<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秋叶集团企业介绍｜页面库</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f3;color:#191b20;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}.hero{padding:52px max(5vw,28px) 30px;background:#111318;color:white}.hero .eyebrow{font-size:13px;letter-spacing:.15em;color:#ff6767}.hero h1{font-size:clamp(30px,4vw,58px);margin:12px 0 10px}.hero p{max-width:820px;color:#bfc3cc;line-height:1.7}.toolbar{position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px max(5vw,28px);background:rgba(245,245,243,.94);backdrop-filter:blur(18px);border-bottom:1px solid #ddd}.toolbar button,.filter{border:1px solid #d7d7d2;background:white;border-radius:999px;padding:9px 14px;cursor:pointer}.toolbar button.primary{background:#e93434;color:white;border-color:#e93434}.toolbar .count{margin-left:auto;font-size:13px;color:#777}.content{padding:28px max(5vw,28px) 100px}.section{margin:0 0 40px}.section h2{font-size:22px;margin:0 0 6px}.section .sub{color:#888;font-size:13px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.card{position:relative;background:white;border:1px solid #e2e2dd;border-radius:16px;padding:18px;min-height:170px;transition:.2s;display:flex;flex-direction:column;gap:8px}.card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(20,20,20,.08)}.card input{position:absolute;right:14px;top:14px;width:18px;height:18px}.num{font-size:11px;color:#e93434;font-weight:700}.title{font-weight:700;padding-right:28px;line-height:1.45}.desc{font-size:12px;color:#888;line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.actions{margin-top:auto;display:flex;gap:8px}.actions a{font-size:12px;color:#333;text-decoration:none;border-bottom:1px solid #aaa}.selected{outline:2px solid #e93434}.bottom{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:none;gap:10px;align-items:center;padding:10px 12px;background:#121418;color:white;border-radius:999px;box-shadow:0 12px 40px rgba(0,0,0,.25)}.bottom.show{display:flex}.bottom button{border:0;border-radius:999px;padding:9px 14px;cursor:pointer}.bottom .go{background:#e93434;color:white}</style></head><body>
<section class="hero"><div class="eyebrow">QIUKYE GROUP · 2026 BUSINESS INTRO</div><h1>秋叶集团动态企业介绍页面库</h1><p>86 个独立 HTML 页面，按业务板块归档。商务老师可勾选任意页面，直接组合成新的线上介绍并全屏播放；每页内置独立解说词与 MiMo TTS 音频位。</p></section>
<div class="toolbar"><button class="filter" data-sec="ALL">全部</button><span id="filters"></span><button id="selectAll">全选当前</button><button id="clear">清空</button><span class="count" id="count">0 页已选</span></div><main class="content" id="app"></main><div class="bottom" id="bottom"><span id="bcount"></span><button id="reverse">倒序</button><button class="go" id="go">进入组合播放 →</button></div>
<script>
let manifest=[],active='ALL',selected=[];const app=document.getElementById('app');fetch('manifest.json').then(r=>r.json()).then(m=>{manifest=m;renderFilters();render()});
function renderFilters(){const secs=[...new Set(manifest.map(x=>x.section))];document.getElementById('filters').innerHTML=secs.map(s=>`<button class="filter" data-sec="${s}">${s.replace(/^\d+_/,'')}</button>`).join('');document.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{active=b.dataset.sec;render()})}
function render(){let arr=active==='ALL'?manifest:manifest.filter(x=>x.section===active);let groups={};arr.forEach(m=>{let k=m.section+'||'+m.subsection;(groups[k]??=[]).push(m)});app.innerHTML=Object.entries(groups).map(([k,items])=>{let[s,sub]=k.split('||');return `<section class="section"><h2>${s.replace(/^\d+_/,'')}</h2><div class="sub">${sub.replace(/^\d+_/,'')}</div><div class="grid">${items.map(card).join('')}</div></section>`}).join('');bind();update()}
function card(m){let checked=selected.includes(m.page)?'checked':'';return `<article class="card ${checked?'selected':''}" data-page="${m.page}"><input type="checkbox" ${checked}><div class="num">PAGE ${String(m.page).padStart(2,'0')}</div><div class="title">${escapeHtml(m.title)}</div><div class="desc">${escapeHtml(m.narration)}</div><div class="actions"><a href="${encodeURI(m.path)}" target="_blank">打开单页</a></div></article>`}
function bind(){document.querySelectorAll('.card').forEach(c=>{let cb=c.querySelector('input');cb.onchange=()=>{let p=+c.dataset.page;if(cb.checked&&!selected.includes(p))selected.push(p);if(!cb.checked)selected=selected.filter(x=>x!==p);c.classList.toggle('selected',cb.checked);update()}})}
function update(){document.getElementById('count').textContent=`${selected.length} 页已选`;document.getElementById('bcount').textContent=`已选 ${selected.length} 页`;document.getElementById('bottom').classList.toggle('show',selected.length>0)}
document.getElementById('clear').onclick=()=>{selected=[];render()};document.getElementById('selectAll').onclick=()=>{let arr=active==='ALL'?manifest:manifest.filter(x=>x.section===active);arr.forEach(x=>{if(!selected.includes(x.page))selected.push(x.page)});render()};document.getElementById('reverse').onclick=()=>{selected.reverse();update()};document.getElementById('go').onclick=()=>{if(selected.length)location.href='present.html?slides='+selected.join(',')};
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script></body></html>
